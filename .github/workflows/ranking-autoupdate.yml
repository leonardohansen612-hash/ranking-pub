name: Atualizar Ranking do Copo

on:
  schedule:
    - cron: "*/15 17-23 * * *"
    - cron: "*/15 0-2 * * *"
  workflow_dispatch:

jobs:
  atualizar-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Atualizar HOJE e salvar snapshot no Firestore
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 90 \
            "https://ranking-pub-wmas.vercel.app/api/ranking?period=today" \
            > /dev/null
